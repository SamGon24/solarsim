; =============================================================================
;  SolarSim body file - Phobos and Deimos (satellites in Mars' equatorial plane)
;
;  Phobos orbits Mars in 7.65 hours, so the automatic time step drops to ~4
;  minutes. Example:
;    solarsim view --bodies data/mars_moons.ini --focus Mars --warp 0.2
;
;  'frame = equatorial' places the orbit in the parent's equatorial plane:
;    a_km     semi-major axis [km]
;    e, i     eccentricity, inclination to the parent's equator [deg]
;    lambda0  mean longitude at J2000 [deg] (approximate phase)
; =============================================================================

[body]
name      = Phobos
kind      = moon
parent    = Mars
frame     = equatorial
a_km      = 9376
e         = 0.0151
i         = 1.08
lambda0   = 0
gm_km3s2  = 7.087e-4
radius_km = 11.27
rotation_hours = 7.65
style     = cratered
color     = #8A7D70
color2    = #4A4038

[body]
name      = Deimos
kind      = moon
parent    = Mars
frame     = equatorial
a_km      = 23463
e         = 0.00033
i         = 1.79
lambda0   = 120
gm_km3s2  = 9.6e-5
radius_km = 6.2
rotation_hours = 30.3
style     = cratered
color     = #9A8D80
color2    = #5A5048
