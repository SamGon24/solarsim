; =============================================================================
;  SolarSim body file - famous comets and interstellar objects
;
;  Load with:   solarsim view --bodies data/comets.ini
;               solarsim render --bodies data/comets.ini --out comets.gif --view inner
;
;  Orbits are heliocentric, ecliptic & equinox J2000. Values are rounded
;  osculating elements near each object's perihelion (approximate - planetary
;  perturbations between apparitions are not included).
;
;  Keys
;    name          required, unique
;    kind          planet | dwarf | moon | asteroid | comet | spacecraft
;    parent        body the elements refer to (default Sun)
;    q / a         perihelion distance or semi-major axis [AU] (a < 0: hyperbola)
;    e             eccentricity (e > 1: hyperbolic, unbound)
;    i, node, argp inclination, longitude of ascending node, argument of perihelion [deg]
;    tp            time of perihelion passage: date "YYYY-MM-DD[THH:MM]" or JD<number>
;      or  M + epoch   mean anomaly [deg] at epoch,  or  L + epoch  mean longitude [deg]
;    mass: gm_km3s2 | mass_kg | mass_earths | mass_suns   (omit -> massless)
;    radius_km, rotation_hours, albedo, color (#RRGGBB), color2, style
;    style         rocky | cratered | icy | comet | cloudy | banded | icegiant | desert ...
; =============================================================================

