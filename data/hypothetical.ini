; =============================================================================
;  SolarSim body file - hypothetical planets ("what if" experiments)
;
;  Try:
;    solarsim precession --bodies data/hypothetical.ini --only Sun,Mercury,Vulcan
;        Le Verrier proposed the intra-Mercurial planet "Vulcan" (1859) to explain
;        the 43"/century anomaly that general relativity later explained. Compare
;        the Newtonian rate with and without Vulcan!
;
;    solarsim render --bodies data/hypothetical.ini --kuiper 3000 --view outer \
;                    --out planet9.gif --days-per-frame 300 --scale log
;        The proposed distant "Planet Nine" (Batygin & Brown 2016).
;
;  See data/comets.ini for the documentation of every key.
; =============================================================================

[body]
name        = Vulcan
kind        = planet
style       = desert
color       = #D86A3A
color2      = #7A2E10
a           = 0.1800
e           = 0.0
i           = 7.0
node        = 48.3
argp        = 0.0
M           = 0.0
epoch       = J2000
mass_earths = 0.05
radius_km   = 1500
notes       = Hypothetical intra-Mercurial planet (Le Verrier 1859) - refuted by GR in 1915

[body]
